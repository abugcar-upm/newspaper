<form #studentForm="ngForm" (ngSubmit)="sendForm()">
    <div class="form-group">
        <label> Title: </label>
        <input class="form-control" 
            type="text" 
            required 
            [(ngModel)]="article.title" 
            name="title" 
            #title="ngModel"
            [ngClass]="title.valid ? '': 'bg-danger'">
    </div>
    <div class="form-group">
        <label> Subtitle: </label>
        <input class="form-control" 
            type="text" 
            required 
            [(ngModel)]="article.subtitle" 
            name="subtitle" 
            #subtitle="ngModel"
            [ngClass]="subtitle.valid ? '': 'bg-danger'">
    </div>
    <div class="form-group">
        <label> Body: </label>
        <textarea class="form-control" 
            [(ngModel)]="article.body" 
            name="body" 
            #body="ngModel"
            [ngClass]="body.valid ? '': 'bg-danger'">
        </textarea>
    </div>
    <div class="form-group">
        <label> Abstract: </label>
        <input class="form-control" 
            type="text" 
            required 
            minlength="10" 
            [(ngModel)]="article.abstract" 
            name="abstract" 
            #abstract="ngModel"
            [ngClass]="abstract.valid ? '': 'bg-danger'">
    </div>
    <div class="form-group">
        <label> Category: </label>
        <select class="form-control" 
            [(ngModel)]="article.category" 
            name="category" 
            #category="ngModel"
            [ngClass]="category.valid ? '': 'bg-danger'">
            <option value="National">National</option>
            <option value="International">International</option>
            <option value="Sports">Sports</option>
            <option value="Economy">Economy</option>
        </select>
    </div>
</form>

<div class="article-preview">
    <h2>Article preview</h2>
    <p>
        Title: {{article.title}} <br>
        Subtitle: {{article.subtitle}} <br>
        Body: {{article.body}} <br>
        Abstract: {{article.abstract}} <br>
        Category: {{article.category}} <br>
    </p>
</div>
