<form #studentForm="ngForm" (ngSubmit)="sendForm()">
    <div class="form-group">
        <label> Title: </label>
        <input class="form-control" 
            type="text" 
            required 
            [(ngModel)]="article.title" 
            name="title" 
            #title="ngModel"
            [ngClass]="title.valid ? '': 'bg-danger'">
    </div>
    <label> Subtitle: <input type="text" required minlength="10" maxlength="50" [(ngModel)]="article.subtitle"></label><br>
    <label> Body: <textarea [(ngModel)]="article.body"></textarea></label><br>
    <label> Abstract: <input type="text" required minlength="10" [(ngModel)]="article.abstract"></label><br>
    <label> Category: <select [(ngModel)]="article.category">
            <option value="National">National</option>
            <option value="International">International</option>
            <option value="Sports">Sports</option>
            <option value="Economy">Economy</option>
        </select>
    </label>
</form>

<div class="article-preview">
    <h2>Article preview</h2>
    <p>
        Title: {{article.title}} <br>
        Subtitle: {{article.subtitle}} <br>
        Body: {{article.body}} <br>
        Abstract: {{article.abstract}} <br>
        Category: {{article.category}} <br>
    </p>
</div>
